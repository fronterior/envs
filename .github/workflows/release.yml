name: release

# Two trigger modes:
#   * tag push (v*)     -> formal release. tag_name = the pushed tag.
#                          make_latest = true (default for action-gh-release).
#   * branch push (**)  -> per-branch prebuilt artifact. tag_name = branch-<sanitized>.
#                          prerelease = true, make_latest = false (does not steal latest).
#                          Each push to the same branch updates the same tag.
#
# Branch artifact mode lets `install.sh --branch <name>` fetch prebuilt zig binaries
# from a feature branch without needing zig installed locally and without using gh CLI.

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.0.1). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    # Zig cross-compiles every target from a single Linux host, so we keep the
    # matrix on ubuntu-latest. This keeps CI cheap and asset naming uniform.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux
          - x86_64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (${{ matrix.target }}, ReleaseFast)
        run: |
          zig build \
            -Dtarget=${{ matrix.target }} \
            --release=fast

      - name: Stage tarball contents
        run: |
          set -eu
          stage="dist/envs-${{ matrix.target }}"
          mkdir -p "$stage" "$stage/example"
          cp zig-out/bin/envs                "$stage/envs"
          chmod 0755                          "$stage/envs"
          cp install.sh                       "$stage/install.sh"
          chmod 0755                          "$stage/install.sh"
          cp envs-source.sh                   "$stage/envs-source.sh"
          cp envs-source.fish                 "$stage/envs-source.fish"
          cp envs-dev-source.sh               "$stage/envs-dev-source.sh"
          cp README.md                        "$stage/README.md"
          cp man/envs.1                       "$stage/envs.1"
          cp example/config                   "$stage/example/config"

      - name: Pack tar.xz
        run: |
          set -eu
          cd dist
          # XZ_OPT=-T0 uses all cores for compression.
          XZ_OPT=-T0 tar -cJf "envs-${{ matrix.target }}.tar.xz" "envs-${{ matrix.target }}"
          ls -lh "envs-${{ matrix.target }}.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: envs-${{ matrix.target }}
          path: dist/envs-${{ matrix.target }}.tar.xz
          if-no-files-found: error
          retention-days: 7

  # End-to-end install smoke against a built tarball. Gates both release jobs.
  # Catches install.sh regressions where binary/wrappers don't land on disk
  # (e.g. v0.0.2 _atomic_install _tmp clobber that left $_envs_home empty).
  install_smoke:
    name: install smoke (x86_64-linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download x86_64-linux tarball
        uses: actions/download-artifact@v4
        with:
          name: envs-x86_64-linux
          path: dist

      - name: Install bats
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Setup zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build zig-out for dev-mode smoke
        run: zig build --release=fast

      - name: Run install smoke
        env:
          SMOKE_TARBALL_PATH: ${{ github.workspace }}/dist/envs-x86_64-linux.tar.xz
        run: |
          set -eu
          ls -la "$SMOKE_TARBALL_PATH"
          # The smoke suite builds its own tarball from the repo tree, but we
          # also drive a sanity pass against the real CI-built tarball: run
          # install.sh in release mode pointed at the downloaded artifact and
          # assert wrappers + binary land on disk in an isolated HOME.
          smoke_home="$(mktemp -d)"
          HOME="$smoke_home" SHELL=/bin/bash \
            ENVS_RELEASE_TARBALL="$SMOKE_TARBALL_PATH" \
            ./install.sh --release v0.0.smoke --no-rc --no-config
          test -x "$smoke_home/.local/lib/envs/envs"
          test -L "$smoke_home/.local/bin/envs"
          test -f "$smoke_home/.local/share/envs/envs-source.sh"
          test -f "$smoke_home/.local/share/envs/envs-source.fish"
          test -f "$smoke_home/.local/share/envs/envs-dev-source.sh"
          test -f "$smoke_home/.local/share/envs/README.md"
          test -f "$smoke_home/.local/share/envs/example/config"
          echo "real-tarball smoke: PASS"

          # Then run the full bats suite (synthesizes its own tarball from the
          # repo, exercises dev mode against zig-out, and end-to-end sources
          # the staged wrappers through bash).
          bats tests/install-smoke.bats

  # Formal release: only on tag pushes (v*) or workflow_dispatch.
  release:
    name: release (tag)
    needs: [build, install_smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Resolve tag
        id: tag
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # install.sh / uninstall.sh uploaded as standalone assets so the
          # README's `releases/latest/download/install.sh` installer is pinned
          # to this tag — same version as the tarball, and only ships after the
          # install_smoke gate passes (needs: install_smoke above).
          files: |
            dist/envs-aarch64-macos.tar.xz
            dist/envs-x86_64-macos.tar.xz
            dist/envs-aarch64-linux.tar.xz
            dist/envs-x86_64-linux.tar.xz
            install.sh
            uninstall.sh

  # Branch artifact: every non-tag branch push gets a rolling `branch-<sanitized>` release.
  # `install.sh --branch <name>` reads from these via the GitHub Release API.
  branch_release:
    name: release (branch)
    needs: [build, install_smoke]
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Compute branch tag
        id: btag
        run: |
          set -eu
          branch="${GITHUB_REF#refs/heads/}"
          # Sanitize: keep [A-Za-z0-9._-], everything else (incl. /) -> '-'.
          # Same rule duplicated in install.sh _sanitize_branch().
          sanitized="$(printf '%s' "$branch" | tr -c 'A-Za-z0-9._-' '-')"
          # Collapse runs of '-' to one, strip leading/trailing '-' for tidiness.
          sanitized="$(printf '%s' "$sanitized" | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"
          if [ -z "$sanitized" ]; then
            echo "branch sanitized to empty string, refusing" >&2
            exit 1
          fi
          echo "branch=$branch"           >> "$GITHUB_OUTPUT"
          echo "sanitized=$sanitized"     >> "$GITHUB_OUTPUT"
          echo "tag=branch-$sanitized"    >> "$GITHUB_OUTPUT"
          echo "envs: branch release tag = branch-$sanitized (from $branch)"

      - name: Create / update branch prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.btag.outputs.tag }}
          name: 'Branch build: ${{ steps.btag.outputs.branch }}'
          body: |
            Rolling prebuilt artifacts for branch `${{ steps.btag.outputs.branch }}`.
            This release is automatically replaced on every push to the branch.

            Install with:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.btag.outputs.branch }}/install.sh \
              | sh -s -- --branch ${{ steps.btag.outputs.branch }}
            ```
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/envs-aarch64-macos.tar.xz
            dist/envs-x86_64-macos.tar.xz
            dist/envs-aarch64-linux.tar.xz
            dist/envs-x86_64-linux.tar.xz
